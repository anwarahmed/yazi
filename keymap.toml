# Only the differences from Yazi's built-in preset are listed here.
# Yazi merges this file over `keymap-default.toml`, and `prepend_keymap` takes
# priority over the preset bindings — see `keymap-default.toml` for the full
# reference.

#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
	{ on = "<Enter>", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
	{ on = "l",       run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
]
