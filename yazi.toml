# Only the differences from Yazi's built-in preset are listed here.
# Yazi merges this file over `yazi-default.toml`, so anything not set below
# keeps its default value — see `yazi-default.toml` for the full reference.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio       = [ 1, 2, 4 ]  # Wider preview pane
show_hidden = true         # Show hidden files by default

[plugin]
# Git status integration, see `plugins/git.yazi`
prepend_fetchers = [
	{ url = "*",  run = "git", group = "git" },
	{ url = "*/", run = "git", group = "git" },
]
